<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#005BAC">
  <meta name="description" content="Tasks and notes for QCU Student Portal.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Tasks &amp; Notes | QCU Portal</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/jpeg" href="assets/images/QCU college of computer studies logo.jpg">
  <link rel="apple-touch-icon" href="assets/images/QCU college of computer studies logo.jpg">
  <link rel="stylesheet" href="assets/css/styles.css?v=55">
  <link rel="stylesheet" href="assets/css/student.css?v=2">
  <link rel="stylesheet" href="assets/css/soft-ui.css?v=33">
  <link rel="stylesheet" href="assets/css/loading.css?v=6">
  <script src="assets/js/loading.js?v=3"></script>
</head>
<body data-page="workspace">
  <div class="app-shell student-shell">
    <a class="student-skip" href="#main-content">Skip to content</a>
    <header id="app-header" class="page-header" data-loading-region="shell" aria-busy="true"><div class="header-inner loading-header" aria-hidden="true"><div class="header-brand"><span class="skeleton-pulse loading-bar loading-avatar"></span><div class="brand-text loading-lines"><span class="skeleton-pulse loading-bar loading-brand-title"></span><span class="skeleton-pulse loading-bar loading-brand-sub"></span></div></div><div class="header-right"><div class="header-clock loading-lines"><span class="skeleton-pulse loading-bar "></span><span class="skeleton-pulse loading-bar "></span></div></div></div></header>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Primary navigation" data-loading-region="shell" aria-busy="true"><div aria-hidden="true"><span class="nav-item loading-nav-item"><span class="skeleton-pulse loading-bar loading-nav-icon"></span><span class="skeleton-pulse loading-bar loading-nav-label"></span></span><span class="nav-item loading-nav-item"><span class="skeleton-pulse loading-bar loading-nav-icon"></span><span class="skeleton-pulse loading-bar loading-nav-label"></span></span><span class="nav-item loading-nav-item"><span class="skeleton-pulse loading-bar loading-nav-icon"></span><span class="skeleton-pulse loading-bar loading-nav-label"></span></span><span class="nav-item loading-nav-item"><span class="skeleton-pulse loading-bar loading-nav-icon"></span><span class="skeleton-pulse loading-bar loading-nav-label"></span></span><span class="nav-item loading-nav-item"><span class="skeleton-pulse loading-bar loading-nav-icon"></span><span class="skeleton-pulse loading-bar loading-nav-label"></span></span></div></nav>

    <main id="main-content" tabindex="-1" class="page-container section-stack workspace-page">
      <section class="student-heading workspace-intro">
        <div>
          <h1 class="page-title">Tasks &amp; Notes</h1>
          <p class="caption" style="margin-top:4px;">Keep action items and study notes together, then switch views when you need to focus.</p>
        </div>
        <div class="workspace-switch" role="tablist" aria-label="Workspace view">
          <button type="button" role="tab" aria-selected="true" aria-controls="workspace-tasks-panel" class="workspace-switch-button is-active" data-workspace-view="tasks">
            <i data-lucide="check-square"></i><span>Tasks</span>
          </button>
          <button type="button" role="tab" aria-selected="false" aria-controls="workspace-notes-panel" class="workspace-switch-button" data-workspace-view="notes">
            <i data-lucide="sticky-note"></i><span>Notes</span>
          </button>
        </div>
      </section>

      <section id="workspace-tasks-panel" data-workspace-panel="tasks" class="workspace-panel is-active" aria-label="Tasks">
        <section class="portal-card">
          <div class="task-toolbar">
            <div class="task-search-wrap">
              <i data-lucide="search" class="task-search-icon"></i>
              <input id="task-search" aria-label="Search tasks" class="task-search-input" type="text" placeholder="Search tasks">
              <button type="button" class="task-search-clear" id="task-search-clear" aria-label="Clear search"><i data-lucide="x"></i></button>
            </div>
            <div class="task-filters">
              <select id="task-filter-status" aria-label="Filter tasks by status" class="task-filter-select">
                <option value="all">All Status</option><option value="pending">Pending</option><option value="done">Done</option>
              </select>
              <select id="task-filter-subject" aria-label="Filter tasks by subject" class="task-filter-select"><option value="all">All Subjects</option></select>
              <select id="task-sort" aria-label="Sort tasks" class="task-filter-select">
                <option value="newest">Newest First</option><option value="oldest">Oldest First</option><option value="priority">Priority</option><option value="deadline">Deadline</option><option value="alpha">A to Z</option>
              </select>
            </div>
          </div>
        </section>
        <section id="task-list" class="section-stack workspace-list" aria-live="polite" data-loading-region="dashboard" aria-busy="true"><div class="loading-placeholder" role="status"><span class="loading-sr">Loading content…</span><div class="loading-cards " aria-hidden="true"><div class="loading-card"><div class="loading-card-top"><span class="skeleton-pulse loading-bar loading-chip"></span><span class="skeleton-pulse loading-bar loading-bar-short"></span></div><div class="loading-lines"><span class="skeleton-pulse loading-bar loading-bar-title"></span><span class="skeleton-pulse loading-bar "></span><span class="skeleton-pulse loading-bar loading-bar-short"></span></div><div class="loading-card-footer"><span class="skeleton-pulse loading-bar loading-chip"></span><span class="skeleton-pulse loading-bar loading-chip"></span></div></div><div class="loading-card"><div class="loading-card-top"><span class="skeleton-pulse loading-bar loading-chip"></span><span class="skeleton-pulse loading-bar loading-bar-short"></span></div><div class="loading-lines"><span class="skeleton-pulse loading-bar loading-bar-title"></span><span class="skeleton-pulse loading-bar "></span><span class="skeleton-pulse loading-bar loading-bar-short"></span></div><div class="loading-card-footer"><span class="skeleton-pulse loading-bar loading-chip"></span><span class="skeleton-pulse loading-bar loading-chip"></span></div></div><div class="loading-card"><div class="loading-card-top"><span class="skeleton-pulse loading-bar loading-chip"></span><span class="skeleton-pulse loading-bar loading-bar-short"></span></div><div class="loading-lines"><span class="skeleton-pulse loading-bar loading-bar-title"></span><span class="skeleton-pulse loading-bar "></span><span class="skeleton-pulse loading-bar loading-bar-short"></span></div><div class="loading-card-footer"><span class="skeleton-pulse loading-bar loading-chip"></span><span class="skeleton-pulse loading-bar loading-chip"></span></div></div></div></div></section>
      </section>

      <section id="workspace-notes-panel" data-workspace-panel="notes" class="workspace-panel" aria-label="Notes" hidden>
        <section class="portal-card">
          <div class="task-toolbar">
            <div class="task-search-wrap">
              <i data-lucide="search" class="task-search-icon"></i>
              <input id="note-search" aria-label="Search notes" class="task-search-input" type="text" placeholder="Search notes">
              <button type="button" class="task-search-clear" id="note-search-clear" aria-label="Clear search"><i data-lucide="x"></i></button>
            </div>
            <div class="task-filters">
              <select id="note-filter-subject" aria-label="Filter notes by subject" class="task-filter-select"><option value="all">All Subjects</option></select>
              <select id="note-sort" aria-label="Sort notes" class="task-filter-select"><option value="newest">Newest First</option><option value="oldest">Oldest First</option><option value="alpha">A to Z</option></select>
            </div>
          </div>
        </section>
        <section id="note-list" class="section-stack workspace-list" aria-live="polite" data-loading-region="dashboard" aria-busy="true"><div class="loading-placeholder" role="status"><span class="loading-sr">Loading content…</span><div class="loading-cards " aria-hidden="true"><div class="loading-card"><div class="loading-card-top"><span class="skeleton-pulse loading-bar loading-chip"></span><span class="skeleton-pulse loading-bar loading-bar-short"></span></div><div class="loading-lines"><span class="skeleton-pulse loading-bar loading-bar-title"></span><span class="skeleton-pulse loading-bar "></span><span class="skeleton-pulse loading-bar loading-bar-short"></span></div><div class="loading-card-footer"><span class="skeleton-pulse loading-bar loading-chip"></span><span class="skeleton-pulse loading-bar loading-chip"></span></div></div><div class="loading-card"><div class="loading-card-top"><span class="skeleton-pulse loading-bar loading-chip"></span><span class="skeleton-pulse loading-bar loading-bar-short"></span></div><div class="loading-lines"><span class="skeleton-pulse loading-bar loading-bar-title"></span><span class="skeleton-pulse loading-bar "></span><span class="skeleton-pulse loading-bar loading-bar-short"></span></div><div class="loading-card-footer"><span class="skeleton-pulse loading-bar loading-chip"></span><span class="skeleton-pulse loading-bar loading-chip"></span></div></div><div class="loading-card"><div class="loading-card-top"><span class="skeleton-pulse loading-bar loading-chip"></span><span class="skeleton-pulse loading-bar loading-bar-short"></span></div><div class="loading-lines"><span class="skeleton-pulse loading-bar loading-bar-title"></span><span class="skeleton-pulse loading-bar "></span><span class="skeleton-pulse loading-bar loading-bar-short"></span></div><div class="loading-card-footer"><span class="skeleton-pulse loading-bar loading-chip"></span><span class="skeleton-pulse loading-bar loading-chip"></span></div></div></div></div></section>
      </section>
    </main>

    <div id="task-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-label="Task form"><div id="task-modal-content" class="modal-card"></div></div>
    <div id="note-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-label="Note form"><div id="note-modal-content" class="modal-card"></div></div>

  </div>

  <script src="assets/js/lucide.min.js?v=1"></script>
  <script src="assets/js/academic.js?v=42"></script>
  <script src="assets/js/app.js?v=76"></script>
</body>
</html>
