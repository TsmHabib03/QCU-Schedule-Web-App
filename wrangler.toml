# Cloudflare Pages configuration
# This project is a static site (HTML/CSS/JS). No framework build is required.
# The build output is the repository root itself.

name = "qcu-schedule-web-app"
pages_build_output_dir = "."
compatibility_date = "2024-11-01"

# [vars] section removed — all runtime env vars are set in the Cloudflare Pages
# dashboard (Settings → Environment variables). This avoids conflicts between
# wrangler.toml defaults and dashboard overrides.
#
# Required env vars:
#   GOOGLE_CLIENT_ID        (plain text)
#   GOOGLE_CLIENT_SECRET    (encrypted)
#   GOOGLE_SESSION_SECRET   (encrypted)
#   GOOGLE_PUBLIC_ORIGIN    (plain text — e.g. https://qcu-schedule-web-app.pages.dev)

# This repository is deployed by Cloudflare Pages. Do not use `wrangler deploy`,
# which is the Workers command and requires a Worker entry point.
