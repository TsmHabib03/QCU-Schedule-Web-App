# Cloudflare Pages configuration
# This project is a static site (HTML/CSS/JS). No framework build is required.
# The build output is the repository root itself.

name = "my-schedule-5hs"
pages_build_output_dir = "."
compatibility_date = "2024-11-01"

[vars]
# OAuth client IDs are public identifiers. The matching client secret must
# remain configured as a protected Cloudflare runtime secret.
GOOGLE_CLIENT_ID = "538685955362-pv7smi77dsjsp8suqrnejs0fj6ppdajf.apps.googleusercontent.com"

# Google compares `redirect_uri` byte-for-byte against the Authorized redirect
# URIs on the OAuth client and accepts no wildcards, while Cloudflare Pages
# gives every deployment its own hostname. Pinning the public origin keeps the
# whole flow on the one host registered with Google:
#   https://my-schedule-5hs.pages.dev/api/google/callback
# Change this to the custom domain if one is ever attached, and register the
# matching callback URL in Google Cloud Console before deploying.
GOOGLE_PUBLIC_ORIGIN = "https://my-schedule-5hs.pages.dev"

# This repository is deployed by Cloudflare Pages. Do not use `wrangler deploy`,
# which is the Workers command and requires a Worker entry point.
