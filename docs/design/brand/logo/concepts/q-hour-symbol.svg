<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- A - "Q Hour": Q bowl doubles as a clock face; the tail is the hand -->
  <path fill="#000" fill-rule="evenodd"
        d="M128 32 a96 96 0 1 0 0 192 a96 96 0 1 0 0 -192 Z
           M128 70 a58 58 0 1 1 0 116 a58 58 0 1 1 0 -116 Z"/>
  <!-- hand / Q tail -->
  <path stroke="#000" stroke-width="22" stroke-linecap="round" d="M128 128 L202 202"/>
  <!-- hub -->
  <circle cx="128" cy="128" r="15" fill="#000"/>
</svg>
