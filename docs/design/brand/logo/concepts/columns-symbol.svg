<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="#000">
  <!-- B - "Three Pillars": the Quezon City monument read as a day's class blocks -->
  <!-- plaza / baseline -->
  <rect x="58" y="196" width="140" height="18" rx="8"/>
  <!-- side pillars -->
  <rect x="70"  y="96"  width="34" height="104" rx="10"/>
  <rect x="152" y="96"  width="34" height="104" rx="10"/>
  <!-- center pillar segmented into stacked class blocks -->
  <rect x="111" y="52"  width="34" height="40" rx="8"/>
  <rect x="111" y="98"  width="34" height="44" rx="8"/>
  <rect x="111" y="148" width="34" height="52" rx="8"/>
</svg>
