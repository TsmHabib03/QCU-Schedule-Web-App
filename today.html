<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Today's Classes — QCU Student Portal</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="index.html">
  <meta http-equiv="refresh" content="0; url=index.html">
  <script>location.replace("index.html");</script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #F4F7FC;
      font-family: 'Plus Jakarta Sans', 'Poppins', -apple-system, 'Segoe UI', sans-serif;
      color: #1A1B41;
    }
    .redirect-card {
      background: #fff;
      border-radius: 28px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      padding: 28px 30px;
      text-align: center;
      max-width: 340px;
    }
    .redirect-card h1 { margin: 0 0 6px; font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
    .redirect-card p { margin: 0 0 16px; font-size: 13px; font-weight: 600; color: #8E92AD; }
    .redirect-card a {
      display: inline-flex;
      padding: 11px 20px;
      border-radius: 9999px;
      background: #4A3AFF;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <!-- The standalone "Today's Classes" page was removed: the dashboard's Today
       Schedule widget shows the same line-up, and the Full Schedule page owns the
       week. This stub keeps old bookmarks and installed PWAs from hitting a 404. -->
  <div class="redirect-card">
    <h1>Today's Classes moved</h1>
    <p>Your classes for today are on the dashboard now.</p>
    <a href="index.html">Open the dashboard</a>
  </div>
</body>
</html>
