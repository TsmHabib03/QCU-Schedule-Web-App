<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#005BAC">
  <meta name="description" content="Your QCU weekly timetable, with day filters, class times, and classroom details.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Full Schedule | QCU Portal</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/jpeg" href="assets/images/QCU college of computer studies logo.jpg">
  <link rel="apple-touch-icon" href="assets/images/QCU college of computer studies logo.jpg">
  <link rel="stylesheet" href="assets/css/styles.css?v=55">
  <link rel="stylesheet" href="assets/css/student.css?v=2">
  <link rel="stylesheet" href="assets/css/soft-ui.css?v=9">
  <link rel="stylesheet" href="assets/css/loading.css?v=1">
  <script src="assets/js/loading.js?v=1"></script>
</head>
<body data-page="schedule">
  <div class="app-shell student-shell">
    <a class="student-skip" href="#main-content">Skip to content</a>
    <header id="app-header" class="page-header" data-loading-region="shell" aria-busy="true"><div class="header-inner loading-header" aria-hidden="true"><div class="header-brand"><span class="skeleton-pulse loading-bar loading-avatar"></span><div class="brand-text loading-lines"><span class="skeleton-pulse loading-bar loading-brand-title"></span><span class="skeleton-pulse loading-bar loading-brand-sub"></span></div></div><div class="header-right"><div class="header-clock loading-lines"><span class="skeleton-pulse loading-bar "></span><span class="skeleton-pulse loading-bar "></span></div><span class="skeleton-pulse loading-bar loading-header-button"></span></div></div></header>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Primary navigation" data-loading-region="shell" aria-busy="true"><div aria-hidden="true"><span class="nav-item loading-nav-item"><span class="skeleton-pulse loading-bar loading-nav-icon"></span><span class="skeleton-pulse loading-bar loading-nav-label"></span></span><span class="nav-item loading-nav-item"><span class="skeleton-pulse loading-bar loading-nav-icon"></span><span class="skeleton-pulse loading-bar loading-nav-label"></span></span><span class="nav-item loading-nav-item"><span class="skeleton-pulse loading-bar loading-nav-icon"></span><span class="skeleton-pulse loading-bar loading-nav-label"></span></span><span class="nav-item loading-nav-item"><span class="skeleton-pulse loading-bar loading-nav-icon"></span><span class="skeleton-pulse loading-bar loading-nav-label"></span></span><span class="nav-item loading-nav-item"><span class="skeleton-pulse loading-bar loading-nav-icon"></span><span class="skeleton-pulse loading-bar loading-nav-label"></span></span></div></nav>

    <main id="main-content" tabindex="-1" class="page-container section-stack">

      <section class="student-heading">
        <div><h1 class="page-title">Full Schedule</h1><p>Your week at a glance. Choose a day to focus on.</p></div>
        <div class="student-actions">
          <a class="student-button" href="today.html"><i data-lucide="clock-3" aria-hidden="true"></i> Today's classes</a>
          <button class="student-button student-button--primary" id="schedule-add-btn" type="button"><i data-lucide="plus" aria-hidden="true"></i> Add class</button>
        </div>
      </section>

      <section class="schedule-controls" aria-label="Schedule filters">
        <div id="schedule-days" class="schedule-days" role="group" aria-label="Filter by day">
          <button type="button" data-schedule-day="all" aria-pressed="true" aria-controls="schedule-rows">Full week</button>
          <button type="button" data-schedule-day="Monday" aria-pressed="false" aria-label="Monday" aria-controls="schedule-rows">Mon</button>
          <button type="button" data-schedule-day="Tuesday" aria-pressed="false" aria-label="Tuesday" aria-controls="schedule-rows">Tue</button>
          <button type="button" data-schedule-day="Wednesday" aria-pressed="false" aria-label="Wednesday" aria-controls="schedule-rows">Wed</button>
          <button type="button" data-schedule-day="Thursday" aria-pressed="false" aria-label="Thursday" aria-controls="schedule-rows">Thu</button>
          <button type="button" data-schedule-day="Friday" aria-pressed="false" aria-label="Friday" aria-controls="schedule-rows">Fri</button>
          <button type="button" data-schedule-day="Saturday" aria-pressed="false" aria-label="Saturday" aria-controls="schedule-rows">Sat</button>
          <button type="button" data-schedule-day="Sunday" aria-pressed="false" aria-label="Sunday" aria-controls="schedule-rows">Sun</button>
        </div>
        <p id="schedule-result" class="schedule-result" role="status" aria-live="polite">Loading your timetable…</p>
      </section>

      <section class="table-wrap">
        <table class="schedule-table" role="table">
          <caption>Weekly class schedule</caption>
          <thead>
            <tr>
              <th>Time</th>
              <th>Subject</th>
              <th>Code</th>
              <th>Location</th>
              <th>Units</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="schedule-rows" data-loading-region="dashboard" aria-busy="true">
            <tr aria-hidden="true"><td><div class="skel-schedule-table"><div class="skel-cell skeleton-pulse" style="width:70px"></div></div></td><td><div class="skel-schedule-table"><div class="skel-cell skeleton-pulse" style="width:140px"></div></div></td><td><div class="skel-schedule-table"><div class="skel-cell-sm skeleton-pulse"></div></div></td><td><div class="skel-schedule-table"><div class="skel-cell-sm skeleton-pulse"></div></div></td><td><div class="skel-schedule-table"><div class="skel-cell-sm skeleton-pulse" style="width:24px"></div></div></td><td><div class="skel-schedule-table"><div class="skel-cell-sm skeleton-pulse"></div></div></td></tr>
            <tr aria-hidden="true"><td><div class="skel-schedule-table"><div class="skel-cell skeleton-pulse" style="width:70px"></div></div></td><td><div class="skel-schedule-table"><div class="skel-cell skeleton-pulse" style="width:120px"></div></div></td><td><div class="skel-schedule-table"><div class="skel-cell-sm skeleton-pulse"></div></div></td><td><div class="skel-schedule-table"><div class="skel-cell-sm skeleton-pulse"></div></div></td><td><div class="skel-schedule-table"><div class="skel-cell-sm skeleton-pulse" style="width:24px"></div></div></td><td><div class="skel-schedule-table"><div class="skel-cell-sm skeleton-pulse"></div></div></td></tr>
            <tr aria-hidden="true"><td><div class="skel-schedule-table"><div class="skel-cell skeleton-pulse" style="width:70px"></div></div></td><td><div class="skel-schedule-table"><div class="skel-cell skeleton-pulse" style="width:100px"></div></div></td><td><div class="skel-schedule-table"><div class="skel-cell-sm skeleton-pulse"></div></div></td><td><div class="skel-schedule-table"><div class="skel-cell-sm skeleton-pulse"></div></div></td><td><div class="skel-schedule-table"><div class="skel-cell-sm skeleton-pulse" style="width:24px"></div></div></td><td><div class="skel-schedule-table"><div class="skel-cell-sm skeleton-pulse"></div></div></td></tr>
          </tbody>
        </table>
      </section>

    </main>

    <!-- Schedule CRUD Modal -->
    <div id="crud-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-label="Schedule entry form">
      <div id="crud-modal-content" class="modal-card"></div>
    </div>


  </div>

  <script src="assets/js/lucide.min.js?v=1"></script>
  <script src="assets/js/academic.js?v=41"></script>
  <script src="assets/js/app.js?v=62"></script>
</body>
</html>
