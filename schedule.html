<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#005BAC">
  <meta name="description" content="Full weekly timetable for Quezon City University ??? current class, upcoming schedule, room and floor details.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Full Schedule | QCU Portal</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/jpeg" href="assets/images/QCU college of computer studies logo.jpg">
  <link rel="apple-touch-icon" href="assets/images/QCU college of computer studies logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css?v=44">
</head>
<body data-page="schedule">
  <div class="app-shell">
    <header id="app-header" class="page-header"></header>

    <main class="page-container section-stack">

      <section class="portal-card">
        <h1 class="page-title">Full Schedule</h1>
        <p class="caption" style="margin-top:4px;">
          Your complete weekly timetable.
          <span style="display:inline-flex;align-items:center;gap:6px;margin-left:6px;">
            <span style="display:inline-block;width:10px;height:10px;background:var(--blue);border-radius:2px;"></span> Current
            <span style="display:inline-block;width:10px;height:10px;background:var(--gold-soft);border:1px solid var(--gold-mid);border-radius:2px;margin-left:4px;"></span> Next
            <span style="display:inline-block;width:10px;height:10px;background:var(--blue-soft);border:1px solid var(--blue-mid);border-radius:2px;margin-left:4px;"></span> Today
          </span>
        </p>
      </section>

      <section class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Subject</th>
              <th>Code</th>
              <th>Location</th>
              <th>Units</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="schedule-rows"></tbody>
        </table>
      </section>

    </main>

    <nav id="bottom-nav" class="bottom-nav" aria-label="Primary navigation"></nav>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="assets/js/app.js?v=40"></script>
</body>
</html>
